"A Region PDA: one created region with its owner, collateral and listing parameters."
type Region {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  regionId: Int!
  owner: String!
  collateral: I64!
  locationCollateral: I64!
  nextOwnerChange: I64!
  listingDuration: I64!
  taxBps: Int!
  locationCount: I64!
}

type RegionConnection {
  nodes: [Region!]!
  totalCount: Int!
}

"A RegionProposal PDA: one proposal to create a region, with its vote tallies. `proposal_id`\nis the global monotonic `config.proposal_counter`, not the region id."
type RegionProposal {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  proposalId: I64!
  proposer: String!
  regionId: Int!
  createdAt: I64!
  expiry: I64!
  voteCutoff: I64!
  yesPower: I64!
  noPower: I64!
  abstainPower: I64!
}

type RegionProposalConnection {
  nodes: [RegionProposal!]!
  totalCount: Int!
}

"A RegionState PDA: the per-region proposal-cycle state machine, closed and re-created at\nthe same address across proposal cycles."
type RegionState {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  regionId: Int!
  status: RegionStatus!
  proposalId: I64!
  proposer: String!
  deposit: I64!
  claimDeadline: I64!
}

type RegionStateConnection {
  nodes: [RegionState!]!
  totalCount: Int!
}

"The regions program's Config PDA (singleton). `null` until `initialize_config` has been\nindexed."
type RegionsConfig {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  authority: String!
  pendingAuthority: String
  xcavMint: String!
  minimumVotingAmount: I64!
  votingPeriod: I64!
  ownerChangePeriod: I64!
  thresholdBps: Int!
  quorum: I64!
  noticePeriod: I64!
  minVoteHold: I64!
  maxListingDuration: I64!
  maxTaxBps: Int!
  locationDeposit: I64!
  proposalCounter: I64!
}

"A reservation total keyed by the investor's payment token account (shared across listings).\nClosed at zero and re-created by the next reserve."
type Reservation {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  tokenAccount: String!
  amount: I64!
}

type ReservationConnection {
  nodes: [Reservation!]!
  totalCount: Int!
}

"A letting agent's notice of resignation from one property."
type ResignationNotice {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  assetId: I64!
  agent: String!
  dueTs: I64!
  rentPayer: String!
}

type ResignationNoticeConnection {
  nodes: [ResignationNotice!]!
  totalCount: Int!
}

"One `(user, role)` assignment. Removal soft-deletes; a later re-assignment reactivates the\nrow and resets its audit fields -- full history is in `WhitelistAction`."
type RoleAssignment {
  id: ID!
  user: String!
  role: Role!
  permission: Permission!
  active: Boolean!
  rentPayer: String!
  assignedBy: String!
  assignedAtSlot: I64!
  assignedAt: DateTime!
  assignedInTx: String!
  updatedAtSlot: I64!
  updatedAt: DateTime!
  removedAtSlot: I64
  removedAt: DateTime
  removedInTx: String
  removalKind: RemovalKind
  removedBy: String
}

type RoleAssignmentConnection {
  nodes: [RoleAssignment!]!
  totalCount: Int!
}

"One owner's share holding in one property asset. The four `lock*` counters mirror the\non-chain per-`LockReason` array (the effective lock is the largest of them); `listed` is\nwhat sits in open secondary listings, still counted in `amount`."
type ShareHolding {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  assetId: I64!
  owner: String!
  amount: I64!
  lockLawyerElection: I64!
  lockAgentElection: I64!
  lockProposal: I64!
  lockChallenge: I64!
  listed: I64!
}

type ShareHoldingConnection {
  nodes: [ShareHolding!]!
  totalCount: Int!
}

"A holder's open secondary-market listing of part of their shares."
type ShareListing {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  shareListingId: I64!
  assetId: I64!
  seller: String!
  sharePrice: I64!
  amount: I64!
  feeBps: Int!
  nextOfferNonce: I64!
  rentPayer: String!
}

type ShareListingConnection {
  nodes: [ShareListing!]!
  totalCount: Int!
}

"Replaces the old SubQuery `_metadata` surface. With four programs indexed, the top-level\nfields are fleet aggregates -- the stack is only as caught-up as its laggiest program:\n`lastContiguousSlot` is the minimum across programs, `backfillComplete` is true only when\nevery program's backfill is complete, `snapshotSlot` is the oldest snapshot (null if any\nprogram has never been snapshotted). Per-program detail is in `programs`."
type SyncStatus {
  lastContiguousSlot: I64!
  backfillComplete: Boolean!
  snapshotSlot: I64
  chainTipSlot: I64!
  slotLag: I64!
  programs: [ProgramSyncStatus!]!
}

"A VoteRecord PDA: one voter's vote on one region proposal."
type VoteRecord {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  proposalId: I64!
  voter: String!
  regionId: Int!
  vote: RegionVote!
  power: I64!
  expiry: I64!
}

type VoteRecordConnection {
  nodes: [VoteRecord!]!
  totalCount: Int!
}

"Append-only audit log entry: one row per successfully indexed whitelist instruction."
type WhitelistAction {
  id: ID!
  type: ActionType!
  subject: String
  role: Role
  permission: Permission
  actor: String!
  slot: I64!
  blockTime: DateTime!
  txSignature: String!
  instructionIndex: String!
}

type WhitelistActionConnection {
  nodes: [WhitelistAction!]!
  totalCount: Int!
}