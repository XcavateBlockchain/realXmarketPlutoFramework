schema {
  query: QueryRoot
}

enum ActionType {
  CONFIG_INITIALIZED
  AUTHORITY_UPDATE_PROPOSED
  AUTHORITY_UPDATED
  ADMIN_ADDED
  ADMIN_REMOVED
  ROLE_ASSIGNED
  ROLE_REMOVED
  ROLE_RENOUNCED
  PERMISSION_UPDATED
}

"`marketplace_listing.developer_lawyer_doc_status` / `spv_lawyer_doc_status`\n(`DocumentStatus` on chain)."
enum DocumentStatus {
  PENDING
  APPROVED
  REJECTED
}

"`property_gov_vote.choice` (`VoteChoice` on chain; borsh order load-bearing there).\nNamed `GovVoteChoice` because the `GovVote` spelling is the entity type."
enum GovVoteChoice {
  YES
  NO
  ABSTAIN
}

"`marketplace_listing.status` (`ListingStatus` on chain; borsh order load-bearing there)."
enum ListingStatus {
  PENDING_ASSETS
  LISTED
  SOLD_OUT
  LEGAL
  FINALIZED
  EXPIRED
  CANCELLED
  REFUNDING
}

enum Permission {
  COMPLIANT
  REVOKED
}

"The four indexed programs, for `programInstructions(program: ...)` filtering and\nattribution. `as_program_id_bytes` mirrors `addresses.json` / the indexer's registry."
enum ProgramName {
  XCAVATE_WHITELIST
  REGIONS
  MARKETPLACE
  PROPERTY
}

"`regions_region_state.status` (`RegionStatus` on chain)."
enum RegionStatus {
  PROPOSING
  PASSED
  REJECTED
}

"`regions_vote_record.vote` (`Vote` on chain). Named `RegionVote` to leave room for other\nprograms' vote enums."
enum RegionVote {
  YES
  NO
  ABSTAIN
}

enum RemovalKind {
  "Removed by an admin (`remove_role`)."
  REMOVED
  "Given up by the holder (`renounce_role`)."
  RENOUNCED
}

enum Role {
  REGIONAL_OPERATOR
  REAL_ESTATE_INVESTOR
  REAL_ESTATE_DEVELOPER
  LAWYER
  LETTING_AGENT
  SPV_CONFIRMATION
}

"Combined date and time (with time zone) in [RFC 3339][0] format.\n\nRepresents a description of an exact instant on the time-line (such as the\ninstant that a user account was created).\n\n[`DateTime` scalar][1] compliant.\n\nSee also [`chrono::DateTime`][2] for details.\n\n[0]: https://datatracker.ietf.org/doc/html/rfc3339#section-5\n[1]: https://graphql-scalars.dev/docs/scalars/date-time\n[2]: https://docs.rs/chrono/latest/chrono/struct.DateTime.html"
scalar DateTime

scalar I64

"`checkAccess(user, role)` (ruling R17): preserves the dropped grpc-api's primary integration\nquery. `hasRole` = an active assignment exists; `compliant` = `hasRole` AND\n`permission == COMPLIANT`."
type AccessCheck {
  hasRole: Boolean!
  compliant: Boolean!
}

"A whitelist admin (`id` = admin address). Removal soft-deletes (`active = false`)."
type Admin {
  id: ID!
  active: Boolean!
  addedBy: String!
  addedAtSlot: I64!
  addedAt: DateTime!
  addedInTx: String!
  removedAtSlot: I64
  removedAt: DateTime
  removedInTx: String
}

type AdminConnection {
  nodes: [Admin!]!
  totalCount: Int!
}

"A letting-agent candidacy for one property's election round."
type AgentCandidacy {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  assetId: I64!
  round: I64!
  agent: String!
  votePower: I64!
  rentPayer: String!
}

type AgentCandidacyConnection {
  nodes: [AgentCandidacy!]!
  totalCount: Int!
}

"One voter's vote in a letting-agent election round."
type AgentVote {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  assetId: I64!
  round: I64!
  voter: String!
  choice: String!
  power: I64!
  rentPayer: String!
}

type AgentVoteConnection {
  nodes: [AgentVote!]!
  totalCount: Int!
}

"A holder's move to strike the sitting agent, backed by an XCAV stake."
type Challenge {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  assetId: I64!
  challengeId: I64!
  challenger: String!
  agent: String!
  deposit: I64!
  expiry: I64!
  tallyYes: I64!
  tallyNo: I64!
  tallyAbstain: I64!
  quorumBps: Int!
  rentPayer: String!
}

type ChallengeConnection {
  nodes: [Challenge!]!
  totalCount: Int!
}

"Singleton (`id = \"config\"`): the sudo authority that manages whitelist admins."
type Config {
  id: ID!
  authority: String!
  pendingAuthority: String
  updatedAtSlot: I64!
  updatedAt: DateTime!
  updatedInTx: String!
}

"One holder's vote on one proposal OR challenge -- the account data does not say which\n(only the on-chain seed prefix differs); join `voteId` against proposals/challenges to\ndisambiguate (see migration 0012)."
type GovVote {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  assetId: I64!
  voteId: I64!
  voter: String!
  choice: GovVoteChoice!
  power: I64!
  rentPayer: String!
}

type GovVoteConnection {
  nodes: [GovVote!]!
  totalCount: Int!
}

