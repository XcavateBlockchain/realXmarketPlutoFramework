}

type QueryRoot {
  "Singleton config row. `null` before `initialize_config` has ever been indexed."
  config: Config
  "`active` filters; omit for both active and removed admins."
  admins(active: Boolean, first: Int, offset: Int): AdminConnection!
  "Single `(user, role)` lookup. Soft-deleted (inactive) assignments are returned too --\nmirrors the old grpc-api's `GetRoleAssignment` semantic."
  roleAssignment(user: String!, role: Role!): RoleAssignment
  roleAssignments(
    user: String
    role: Role
    permission: Permission
    active: Boolean
    first: Int
    offset: Int
  ): RoleAssignmentConnection!
  whitelistActions(
    subject: String
    actor: String
    type: ActionType
    txSignature: String
    first: Int
    offset: Int
  ): WhitelistActionConnection!
  "`hasRole` = an active `(user, role)` assignment exists; `compliant` = `hasRole` AND\n`permission == COMPLIANT` (ruling R17)."
  checkAccess(user: String!, role: Role!): AccessCheck!
  "Fleet aggregates plus per-program rows -- see [`SyncStatus`]'s doc for the aggregate\nsemantics (min / AND across programs: the stack is only as caught-up as its laggiest\nprogram). Scoped by the api's optional `PROGRAMS` env so subset operation (which\nfreezes excluded programs' rows) does not drag the aggregates."
  syncStatus: SyncStatus!
  "Each program's recorded version timeline (`program_upgrades`, ADR-24), oldest boundary\nfirst: the seeded deploy slot plus every BPFLoaderUpgradeable upgrade the indexer has\nobserved on-chain. More than one entry for a program means its bytecode changed after\nthe checked-in IDL's snapshot -- the signal the maintenance loop acts on (RUNBOOK.md\n\"After a program upgrade\"). Unpaginated on purpose: upgrades are rare, operator-driven\nevents (a handful of rows per program, ever). Scoped by the api's optional `PROGRAMS`\nenv like `syncStatus`."
  programUpgrades(program: ProgramName): [ProgramUpgrade!]!
  "The shared instruction history: every successfully indexed instruction of every\nindexed program, newest first, with its decoded args as JSON. `txSignature` filters to\none transaction (base58)."
  programInstructions(
    program: ProgramName
    ixName: String
    txSignature: String
    first: Int
    offset: Int
  ): ProgramInstructionConnection!
  "The marketplace program's singleton config PDA."
  marketplaceConfig: MarketplaceConfig
  "Property listings on the marketplace."
  listings(
    listingId: I64
    developer: String
    status: ListingStatus
    active: Boolean
    first: Int
    offset: Int
  ): ListingConnection!
  "Investors' per-listing positions."
  investorPositions(
    listingId: I64
    investor: String
    cancelled: Boolean
    active: Boolean
    first: Int
    offset: Int
  ): InvestorPositionConnection!
  "The marketplace's lawyer registry."
  lawyers(lawyer: String, active: Boolean, first: Int, offset: Int): LawyerConnection!
  "SPV-lawyer election candidacies."
  lawyerCandidacies(
    listingId: I64
    lawyer: String
    active: Boolean
    first: Int
    offset: Int
  ): LawyerCandidacyConnection!
  "SPV-lawyer election votes."
  lawyerVotes(
    listingId: I64
    voter: String
    active: Boolean
    first: Int
    offset: Int
  ): LawyerVoteConnection!
  "Tokenised property assets backing listings. Each node nests the fetched-and-\ndecomposed off-chain metadata document (`metadata`, ADR-27) when the enricher has\none for the asset's PDA — asset + document in a single query (`metadata` is\n`null` while the fetch is pending or failing)."
  propertyAssets(
    assetId: I64
    regionId: Int
    active: Boolean
    first: Int
    offset: Int
  ): PropertyAssetConnection!
  "Fetched and decomposed off-chain metadata for property assets (ADR-27): the indexer's\nbackground enricher downloads the JSON document each `metadataUri` points at; one row\nper asset, latest snapshot first."
  propertyMetadata(assetId: I64, first: Int, offset: Int): PropertyMetadataConnection!
  "Per-token-account reservation totals."
  reservations(tokenAccount: String, active: Boolean, first: Int, offset: Int): ReservationConnection!
  "Investors' share holdings per asset."
  shareHoldings(
    assetId: I64
    owner: String
    active: Boolean
    first: Int
    offset: Int
  ): ShareHoldingConnection!
  "Secondary-market share listings. `shareListingId` filters by the on-chain listing id\n(a separate id space from primary `listings`)."
  shareListings(
    shareListingId: I64
    assetId: I64
    seller: String
    active: Boolean
    first: Int
    offset: Int
  ): ShareListingConnection!
  "Bids on secondary-market share listings. `listingId` is the ShareListing id."
  offers(
    listingId: I64
    offeror: String
    active: Boolean
    first: Int
    offset: Int
  ): OfferConnection!
  "The property program's singleton config PDA."
  propertyConfig: PropertyConfig
  "Letting-agent election candidacies."
  agentCandidacies(
