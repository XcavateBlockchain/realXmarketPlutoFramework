}

type LawyerVoteConnection {
  nodes: [LawyerVote!]!
  totalCount: Int!
}

"A registered letting agent. `locations` is the raw JSON of the on-chain location list\n(`[{\"postcode\": \"...\", \"assigned_count\": N, \"deposit\": N}, ...]` -- see migration 0010)."
type LettingAgent {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  wallet: String!
  regionId: Int!
  locations: String!
