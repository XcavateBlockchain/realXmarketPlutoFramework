}

type LettingAgentConnection {
  nodes: [LettingAgent!]!
  totalCount: Int!
}

"A property listing: sale terms, progress counters, the two flattened `LawyerAssignment`s,\nthe flattened `SpvElection` and per-mint collected totals. `collected` is the raw JSON\n`[{\"mint\": \"<base58>\", \"funds\": N, \"fee\": N, \"tax\": N}, ...]` (see migration 0009)."
type Listing {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  listingId: I64!
  developer: String!
  assetId: I64!
  sharePrice: I64!
  listedShareAmount: I64!
  soldShareAmount: I64!
  reservedShareAmount: I64!
  taxPaidByDeveloper: Boolean!
  taxBps: Int!
  marketplaceFeeBps: Int!
  investorFeeBps: Int!
  maxOwnershipBps: Int!
  listingExpiry: I64!
  claimingTime: I64!
  claimDeadline: I64!
  legalProcessTime: I64!
  lawyerVotingTime: I64!
  minVotingQuorumBps: Int!
  positionCount: I64!
  legalDeadline: I64!
  deposit: I64!
  developerLawyer: String!
  developerLawyerCosts: I64!
  developerLawyerDocStatus: DocumentStatus!
  developerLawyerDocumentsHash: String!
  spvLawyer: String!
  spvLawyerCosts: I64!
  spvLawyerDocStatus: DocumentStatus!
  spvLawyerDocumentsHash: String!
  secondAttempt: Boolean!
  developerEngaged: Boolean!
  spvCostsDue: I64!
  spvCostsPayee: String!
  collectedFeeQuote: I64!
  collected: String!
  spvElectionExpiry: I64!
  spvElectionCandidateCount: I64!
  spvElectionRound: I64!
  status: ListingStatus!
  "The tokenised property this listing sells, joined by the listing's `asset_id`;\n`null` while the listing is still `PENDING_ASSETS` (the asset PDA does not exist yet),\nso the asset and its nested `metadata` document answer in the same query as the listing."
  propertyAsset: PropertyAsset
}

type ListingConnection {
  nodes: [Listing!]!
  totalCount: Int!
}

"A Location PDA: one registered postcode within a region. `postcode` is the on-chain byte\nstring (1-10 bytes of uppercase ASCII) rendered as UTF-8."
type Location {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  regionId: Int!
  postcode: String!
  deposit: I64!
}

type LocationConnection {
  nodes: [Location!]!
  totalCount: Int!
}

"The marketplace program's Config PDA (singleton). `null` until `initialize_config` has been\nindexed. `accepted_payment_mints` is the raw JSON of the accepted mint list\n(`[\"<base58>\", ...]` -- see migration 0009)."
type MarketplaceConfig {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  authority: String!
  pendingAuthority: String
  xcavMint: String!
  treasury: String!
  rentCollector: String!
  acceptedPaymentMints: String!
  listingDeposit: I64!
  lawyerDeposit: I64!
  minPropertyShares: I64!
  maxPropertyShares: I64!
  marketplaceFeeBps: Int!
  investorFeeBps: Int!
  maxOwnershipBps: Int!
  claimingTime: I64!
  legalProcessTime: I64!
  lawyerVotingTime: I64!
  minVotingQuorumBps: Int!
  nextListingId: I64!
  nextShareListingId: I64!
}

"A bid on one share listing, one per bidder per listing; the bid money sits in the\noffer's own vault until accept/reject/cancel. `listingId` is the ShareListing id."
type Offer {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  listingId: I64!
  assetId: I64!
  offeror: String!
  sharePrice: I64!
  amount: I64!
  paymentMint: String!
  held: I64!
  nonce: I64!
  rentPayer: String!
}

type OfferConnection {
  nodes: [Offer!]!
  totalCount: Int!
}

"One row of the shared `program_instructions` history: every successfully indexed\ninstruction of every indexed program, with its decoded args as JSON. `id` is\n`\"<txSignature>-<ixIndex>\"` for a top-level instruction and\n`\"<txSignature>-<ixIndex>.<innerIndex>\"` for a CPI."
type ProgramInstruction {
  id: ID!
  program: ProgramName!
  txSignature: String!
  ixIndex: Int!
  innerIndex: Int!
  slot: I64!
  blockTime: DateTime!
  ixName: String!
  "The instruction's account list, in order, base58."
  accounts: [String!]!
  "The decoded instruction args as JSON text (the decoder enum's serde shape)."
  data: String!
}

type ProgramInstructionConnection {
  nodes: [ProgramInstruction!]!
  totalCount: Int!
}

"One program's `sync_state` row."
type ProgramSyncStatus {
  program: ProgramName!
  lastContiguousSlot: I64!
  backfillComplete: Boolean!
  backfillFloorSlot: I64!
  snapshotSlot: I64
}

"One recorded version boundary of a program (`program_upgrades`, ADR-24): a slot at which\nbytecode became live for that program."
type ProgramUpgrade {
  program: ProgramName!
  "Slot the version's bytecode became live."
  upgradeSlot: I64!
  "base58 signature of the upgrade transaction; null for the seeded deploy row."
  signature: String
  "`\"deploy\"` (the seeded initial deploy slot) or `\"chain\"` (an observed\nBPFLoaderUpgradeable upgrade). A plain string, not a GraphQL enum, on purpose: it is\nan internal provenance tag with no on-chain borsh order to mirror, and keeping it a\nstring means widening the migration's CHECK never needs an api release in lockstep."
  source: String!
  detectedAt: DateTime!
}

"The tokenised property behind one listing (`asset_id == listing_id` in current source).\n`name` and `metadata_uri` are empty until `init_property_assets` attaches them.\n`metadata` is the fetched-and-decomposed off-chain document `metadata_uri` points at\n(ADR-27), nested so asset and document answer in ONE query; `null` while the enricher\nhas no row for this PDA (fetch pending or still failing)."
type PropertyAsset {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  assetId: I64!
  name: String!
  metadataUri: String!
  "The fetched-and-decomposed metadata document (ADR-27); `null` until one exists."
  metadata: PropertyMetadata
  shareMint: String!
  regionId: Int!
  location: String!
  shareAmount: I64!
  spvCreated: Boolean!
  finalized: Boolean!
  holderCount: I64!
}

type PropertyAssetConnection {
  nodes: [PropertyAsset!]!
  totalCount: Int!
}

"The property program's Config PDA (singleton). `null` until `initialize_config` has been\nindexed."
type PropertyConfig {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  authority: String!
  pendingAuthority: String
  xcavMint: String!
  treasury: String!
  rentCollector: String!
  agentDeposit: I64!
