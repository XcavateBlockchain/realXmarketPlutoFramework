  rentPayer: String!
}

type PropertyLettingConnection {
  nodes: [PropertyLetting!]!
  totalCount: Int!
}

"One fetched-and-decomposed metadata document. Wallets are base58; `raw` /\n`otherDocuments` / `propertyImages` are raw JSON (juniper has no JSON scalar); the nested\nobjects are present only when the document had at least one field in them."
type PropertyMetadata {
  id: ID!
  assetId: I64!
  "The URI the last attempt targeted."
  metadataUri: String!
  "When the last successful snapshot was fetched; `null` until one exists."
  fetchedAt: DateTime
  "Consecutive failures for `metadata_uri` (reset to 0 by a success)."
  attempts: Int!
  "The last failure's message; `null` when the row's state is a success."
  lastError: String
  "The whole document verbatim -- the ground truth the typed fields are derived from;\n`null` until the first successful fetch."
  raw: String
  propertyId: String
  propertyName: String
  propertyType: String
  status: String
  tenure: String
  propertyDescription: String
  planningCode: String
  buildingControlCode: String
  user: String
  companyId: String
  companyName: String
  companyLogo: String
  companyWalletAddress: String
  createdAt: DateTime
  updatedAt: DateTime
  address: PropertyMetadataAddress
  attributes: PropertyMetadataAttributes
  finances: PropertyMetadataFinances
  floorPlan: String
  mapUrl: String
  salesAgreement: String
  "Raw JSON array of URL strings."
  otherDocuments: String
  "Raw JSON array of URL strings."
  propertyImages: String
}

"The document's `address` object."
type PropertyMetadataAddress {
  street: String
  townCity: String
  flatOrUnit: String
  postCode: String
  localAuthority: String
  region: String
  location: String
}

"The document's `attributes` object."
type PropertyMetadataAttributes {
  area: String
  quality: String
  outdoorSpace: String
  numberOfBedrooms: I64
  numberOfBathrooms: I64
  "The document's `YYYY-MM-DD` date, as stored."
  constructionDate: String
