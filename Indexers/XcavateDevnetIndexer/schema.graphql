  minVotingQuorumBps: Int!
  agentNoticePeriod: I64!
  proposalVotingTime: I64!
  lowProposal: I64!
  highProposal: I64!
  highThresholdBps: Int!
  autoApprovalCooldown: I64!
  challengeDeposit: I64!
  agentSlashAmount: I64!
}

"A property's rental income ledger. `streams` is the raw JSON\n`[{\"mint\": \"<base58>\", \"per_share\": \"<decimal string>\", \"dust\": N}, ...]` (see migration\n0012; `per_share` is u128 on-chain, carried as a decimal string)."
