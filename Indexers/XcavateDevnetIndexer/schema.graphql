}

type PropertyIncomeConnection {
  nodes: [PropertyIncome!]!
  totalCount: Int!
}

"One property's letting seat and current election. `agent` keeps the on-chain all-zero\npubkey \"seat vacant\" sentinel verbatim (base58 `11111111111111111111111111111111`)."
type PropertyLetting {
  id: ID!
  slot: I64!
  lamports: I64!
  active: Boolean!
  closedAtSlot: I64
  assetId: I64!
  agent: String!
  electionExpiry: I64!
  electionCandidateCount: I64!
  electionRound: I64!
