# The tokenised property behind one listing (`asset_id == listing_id` in the current
# programs, but the join is by the listing's own `assetId` so that staying true is not
# load-bearing here).
#
# A PENDING_ASSETS listing has no PropertyAsset yet - an empty result is a normal
# answer, not an error.
#
# `name` is empty until `init_property_assets` attaches it. `metadata` is the
# off-chain property document (name, address, images, finances) the indexer has
# already fetched and decomposed (ADR-27), nested so the asset and its document
# answer in ONE query - `null` while the enricher has no snapshot for this PDA
# yet. The app no longer fetches and parses `metadataUri` itself.
query MarketplacePropertyAsset($assetId: I64!) {
  propertyAssets(assetId: $assetId, active: true, first: 1, offset: 0) {
    nodes {
      id
      assetId
      name
      shareMint
      regionId
      location
      shareAmount
      spvCreated
      finalized
      holderCount
      metadata {
        propertyId
        propertyName
        propertyType
        status
        propertyDescription
        planningCode
        mapUrl
        companyName
        companyLogo
        companyWalletAddress
        user
        createdAt
        updatedAt
        propertyImages
        address {
          street
          townCity
          flatOrUnit
          postCode
          localAuthority
        }
        attributes {
          area
          quality
          outdoorSpace
          numberOfBedrooms
          numberOfBathrooms
          constructionDate
          offStreetParking
        }
        finances {
          propertyPrice
          numberOfShares
          sharePrice
          estimatedRentalIncome
          annualServiceCharge
          stampDutyTax
          isStampDutyPaid
          isAnnualServiceChargePaid
        }
      }
    }
  }
}
