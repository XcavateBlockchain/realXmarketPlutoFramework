# The marketplace page's listing feed.
#
# `active: true` keeps only listings whose PDA is still open on chain - a closed
# (fully wound-down) listing has nothing left to show or act on.
#
# `feedStates` (ADR-39) filters the feed server-side to the states checked in the
# page's filter popup. The filter is DERIVED, not a raw status match (see the
# `ListingFeedState` enum's doc): FOR_SALE is LISTED with the sale window still open
# and shares available (a LISTED row past `listing_expiry` is EXPIRED, whether or not
# anyone cranked `withdraw_expired` yet), WAITING_FOR_CLAIM is a fully committed
# LISTED row whose claim window is pending or open (claims run under LISTED on
# chain - SOLD_OUT flips only once every share is sold), and so on. The app always
# passes the selection explicitly - including an empty list, which matches nothing,
# the "all checkboxes off" case.
#
# `first` and `offset` deliberately carry no GraphQL default: this indexer rejects a
# default on a non-null variable outright ("Argument `first` has type `Int!` and is not
# nullable, so it can't have a default value"). The caller passes both.
#
# There is no text filtering here on purpose. This indexer only knows on-chain state,
# so the old `includesInsensitive` town/type/name filters have no server-side
# counterpart; the app filters the mapped page client-side instead.
#
# `propertyAsset` is nested on the listing itself: the indexer joins it by the
# listing's own `asset_id` in the same request, so the feed answers listing, asset
# and the asset's decomposed `metadata` document in ONE query - `null` for
# PENDING_ASSETS listings whose asset PDA does not exist yet.
#
# This file deliberately holds ALL THREE of these queries together: the
# StrawberryShake codegen names the `ListingParts` fragment's nested types after
# the operation it processes first, and the order in which separate .graphql FILES
# are read is filesystem-dependent. With the queries in two files the generated
# names differed between machines (CI vs. local: `IMarketpageListings_...` vs.
# `IMarketpageListing_...`) and broke the build non-deterministically. In ONE file
# the order is fixed by parse order, so the names are stable. `MarketplaceListings`
# stays first - every other operation in this file must come after it.
query MarketplaceListings($first: Int!, $offset: Int!, $feedStates: [ListingFeedState!]) {
  listings(active: true, feedStates: $feedStates, first: $first, offset: $offset) {
    totalCount
    nodes {
      ...ListingParts
    }
  }
}

# One listing, refetched fresh when the user opens its detail page. The list feed's
# data may be minutes old by then; sale progress and status move under it.
#
# `active: true` matters here as much as in the feed: a listing wound down after the
# feed loaded is soft-deleted, and an empty result is how the caller learns to keep
# its stale-but-live list data instead of presenting a closed listing as current.
#
# `listingId` filters exactly (it is the listing's on-chain id, not the row id), so
# `first: 1` is always the whole answer.
query MarketplaceListing($listingId: I64!) {
  listings(listingId: $listingId, active: true, first: 1, offset: 0) {
    nodes {
      ...ListingParts
    }
  }
}

fragment ListingParts on Listing {
  id
  listingId
  developer
  assetId
  sharePrice
  listedShareAmount
  soldShareAmount
  reservedShareAmount
  taxPaidByDeveloper
  taxBps
  investorFeeBps
  listingExpiry
  claimDeadline
  # The legal phase: lawyer assignments, the SPV-lawyer election state and the
  # legal deadline the terms vote's window is capped by. The detail page's
  # voting section reads these; they are plain scalars on the listing row.
  legalDeadline
  legalProcessTime
  lawyerVotingTime
  minVotingQuorumBps
  # The listing's snapshotted ownership cap (bps of share_amount); send_property_shares
  # pins the receiver's post-transfer holding below it.
  maxOwnershipBps
  developerLawyer
  developerLawyerCosts
  developerLawyerDocStatus
  developerLawyerDocumentsHash
  spvLawyer
  spvLawyerCosts
  spvLawyerDocStatus
  spvLawyerDocumentsHash
  secondAttempt
  developerEngaged
  spvCostsDue
  spvCostsPayee
  # What each payment mint collected across the sale, as raw JSON
  # (`[{"mint": "<base58>", "funds": N, "fee": N, "tax": N}, ...]`) - execute_deal's
  # payout loop iterates one account group per mint.
  collected
  spvElectionExpiry
  spvElectionCandidateCount
  spvElectionRound
  status
  propertyAsset {
    id
    assetId
    name
    shareMint
    regionId
    location
    shareAmount
    spvCreated
    finalized
    holderCount
    metadata {
      propertyId
      propertyName
      propertyType
      status
      propertyDescription
      planningCode
      mapUrl
      companyName
      companyLogo
      companyWalletAddress
      user
      createdAt
      updatedAt
      propertyImages
      # 720x720 JPEG mirrors of `propertyImages` (same order); null until the mirror's
      # first upload for the asset. The app shows these everywhere except the full-screen
      # image page, which is the only surface that loads the full-resolution originals.
      propertyImageThumbnails
      address {
        street
        townCity
        flatOrUnit
        postCode
        localAuthority
      }
      attributes {
        area
        quality
        outdoorSpace
        numberOfBedrooms
        numberOfBathrooms
        constructionDate
        offStreetParking
      }
      finances {
        propertyPrice
        numberOfShares
        sharePrice
        estimatedRentalIncome
        annualServiceCharge
        stampDutyTax
        isStampDutyPaid
        isAnnualServiceChargePaid
      }
    }
  }
}

# The investor page's property list, one page at a time. ONE query answers the
# page: `investorProperties` (ADR-34) joins the investor's open positions to their
# listings plus the listings' `propertyAsset` metadata server-side, so the app no
# longer fans out one listing lookup per position.
#
# Every filter runs in SQL, not in the app:
#   `owned`    - only positions that hold bought shares (the "purchased" toggle),
#   `reserved` - only positions that hold reserved shares (the "reserved" toggle),
#   `name`     - case-insensitive substring of the property name OR postcode
#                (the search bar),
#   `townCity` / `propertyType` - the filter popup's dropdowns.
# Null (absent) arguments switch a filter off; the app converts its empty/All
# values to null before calling. `totalCount` reflects the filters, so the page
# knows when the last one has been reached.
#
# Like `first`/`offset` above, the nullable filter arguments carry no GraphQL
# default: the indexer rejects defaults on non-null variables and the app always
# decides explicitly which filters are on.
query InvestorProperties(
  $investor: String!
  $owned: Boolean
  $reserved: Boolean
  $name: String
  $townCity: String
  $propertyType: String
  $first: Int!
  $offset: Int!
) {
  investorProperties(
    investor: $investor
    owned: $owned
    reserved: $reserved
    name: $name
    townCity: $townCity
    propertyType: $propertyType
    first: $first
    offset: $offset
  ) {
    totalCount
    nodes {
      id
      listingId
      investor
      shareAmount
      reservedShareAmount
      listing {
        ...ListingParts
      }
    }
  }
}

# The lawyer page's property list. ONE query serves both of its filters: the
# `assignedLawyer` arg keeps listings where the wallet already sits in a lawyer slot
# (the "Under Instruction" filter), `assignableTo` keeps SOLD_OUT listings whose legal
# window is still open with a vacant lawyer slot the wallet could claim, ordered by
# sold-out recency (the "Newly listed" filter). The caller sets exactly one of the two;
# both absent would be the unfiltered feed, which the page never asks for.
#
# `first`/`offset` carry no GraphQL default for the same reason as the operations
# above, and `totalCount` answers the "Manage properties" stat cell with a
# `first: 1` call - no full page fetch just to count.
query LawyerProperties($assignedLawyer: String, $assignableTo: String, $first: Int!, $offset: Int!) {
  listings(assignedLawyer: $assignedLawyer, assignableTo: $assignableTo, first: $first, offset: $offset) {
    totalCount
    nodes {
      ...ListingParts
    }
  }
}

# The developer page's property list: every listing the wallet CREATED, identified by the
# listing's own `developer` field (the creator's base58 Solana wallet) rather than by a
# lawyer slot or a share position - the same attribute the web app resolves through
# company indirection, read straight off the listing here.
#
# `statuses` carries the page's ONE active lifecycle filter (see
# `XcavateMarketplaceIndexerModel.GetDeveloperPropertiesAsync`): a single-element list
# narrows the page to that state, null answers with the developer's whole book. It is a
# list rather than the singular `status` argument because "Properties sold" spans three
# on-chain states (SOLD_OUT, LEGAL, FINALIZED) and the merge has to happen server-side,
# inside the same `totalCount` the stat cell reads - the same reason `MarketplaceListings`
# filters by `feedStates` rather than by status.
#
# The web page's five tabs (drafts / submitted / verified / listed / rejected) are the
# off-chain listing-review workflow, which lives in the web app's own database: none of
# those states exists on chain or in this indexer, so this page filters by the lifecycle a
# developer's listing actually occupies instead. See `DeveloperPropertyFilter` in
# `XcavateMarketplaceIndexerModel.cs` for the mapping and what each web tab became.
#
# `first`/`offset` carry no GraphQL default (the indexer rejects defaults on non-null
# variables), and `totalCount` answers the stat cells with a `first: 1` call - no full page
# fetch just to count.
query DeveloperProperties($developer: String, $statuses: [ListingStatus!], $first: Int!, $offset: Int!) {
  listings(developer: $developer, statuses: $statuses, first: $first, offset: $offset) {
    totalCount
    nodes {
      ...ListingParts
    }
  }
}
