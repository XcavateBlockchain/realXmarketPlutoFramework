# Every owner's share holding in one property asset, for the detail page's
# "Shares owned" figure and the share-owner breakdown after claiming.
#
# Paged by the caller (holder counts are unbounded in principle); `first`/`offset`
# are explicit because this indexer rejects defaults on non-null variables.
query MarketplaceShareHoldings($assetId: I64!, $first: Int!, $offset: Int!) {
  shareHoldings(assetId: $assetId, active: true, first: $first, offset: $offset) {
    totalCount
    nodes {
      id
      owner
      amount
      listed
      lockLawyerElection
      lockAgentElection
      lockProposal
      lockChallenge
    }
  }
}

# One owner's share ledger for one asset: the detail page's voting sections read
# their voting power (amount minus listed minus the locks other votes already hold)
# from it. One row max - the (asset, owner) pair keys its PDA.
query MarketplaceShareHoldingOf($assetId: I64!, $owner: String!) {
  shareHoldings(assetId: $assetId, owner: $owner, active: true, first: 1, offset: 0) {
    totalCount
    nodes {
      id
      owner
      amount
      listed
      lockLawyerElection
      lockAgentElection
      lockProposal
      lockChallenge
    }
  }
}
