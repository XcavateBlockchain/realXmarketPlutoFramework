# One investor's open positions across every listing: the feed behind the investor
# page's "properties I reserved or purchased" list.
#
# `cancelled: false` drops refunded reservations and `active: true` drops positions the
# program has closed (wound down or fully claimed) - a closed position holds no open
# shares. `shareAmount` is what the investor has bought, `reservedShareAmount` what they
# have only reserved; a row with neither carries nothing to show, so the caller keeps
# the whole page and drops the zero-share rows itself.
#
# The position row only carries the `listingId`; the property details (name, images,
# address, finances) are the listing's joined `propertyAsset` document, fetched with the
# per-listing `MarketplaceListing` query.
#
# `first` and `offset` deliberately carry no GraphQL default: this indexer rejects a
# default on a non-null variable outright ("Argument `first` has type `Int!` and is not
# nullable, so it can't have a default value"). The caller passes both.
query InvestorProperties($investor: String!, $first: Int!, $offset: Int!) {
  investorPositions(
    investor: $investor
    cancelled: false
    active: true
    first: $first
    offset: $offset
  ) {
    totalCount
    nodes {
      id
      listingId
      investor
      shareAmount
      reservedShareAmount
    }
  }
}
